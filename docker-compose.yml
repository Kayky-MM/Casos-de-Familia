services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

    networks:
      - public_network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    restart: always
    networks:
      - public_network
    depends_on:
      - backend

networks:
  public_network:
    driver: bridge

volumes:
  mysql_data: